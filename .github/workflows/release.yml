name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show
      - name: Validate tag against Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $package = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'no-router-mercy'
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") { throw 'Release tag must match Cargo.toml version' }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test architecture
        shell: pwsh
        run: |
          $target = if ('${{ matrix.arch }}' -eq 'x86') { 'i686-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          cargo test --locked --target $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package installer and portable ZIP
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Architecture '${{ matrix.arch }}' -OutputDirectory '${{ runner.temp }}/release'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "No Router-Mercy $RELEASE_TAG" --generate-notes
          fi
